apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes: 
  - ReadWriteOnce
  resources:
  requests:
    storage: 5Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: "postgres"
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
  spec:
    containers:
    - name: postgres
      image: postgres:latest # You can change the version here
      ports:
      - containerPort: 5432
      env:          
      - name: POSTGRES_PASSWORD
        value: "mypassword" # Make sure to store it securely
      - name: POSTGRES_USER
        value: "myuser"
      - name: POSTGRES_DB
        value: "profiles"
      volumeMounts:
      - name: postgres-data
        mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
    resources:
        requests:
          storage: 5Gi
    storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None  # This makes the service headless (useful for StatefulSet)
  ports:
  - port: 5432
  name: postgres
  selector:
    app: postgres