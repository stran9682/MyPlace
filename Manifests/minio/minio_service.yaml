apiVersion: v1
kind: Service
metadata:
  name: minio-nodeport
spec:
  ports:
  - name: http-minio
    port: 9000
    targetPort: 9000
  selector:
    v1.min.io/tenant: minio
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: console-nodeport
spec:
  ports:
  - name: http-console
    port: 9090
    targetPort: 9090
  selector:
    v1.min.io/tenant: minio
  type: NodePort