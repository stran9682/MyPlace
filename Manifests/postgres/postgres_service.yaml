apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: postgres-system
spec:
  type: NodePort
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    cnpg.io/cluster: postgres-cluster
    role: primary  # Only routes to the primary (read-write) instance