name: upload-API
on:
  push:
    branches:
      - "main"
    paths:
      - 'MyPlace_Backend/UploadAPI/**'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: build & push Upload-API image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push API
        id: build-push-api
        uses: docker/build-push-action@v3
        with:
          context: ./MyPlace_Backend
          file: ./MyPlace_Backend/UploadAPI/Dockerfile
          push: true
          tags: stran9682/uploadapi:latest