services:
  postgres:
    image: postgres:latest
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: profiles
    networks:
      - connections
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: redis
    networks:
      - connections
    ports:
      - "6379:6379"

volumes:
  postgres_data:

networks:
  connections: